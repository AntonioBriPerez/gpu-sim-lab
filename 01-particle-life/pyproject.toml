[project]
name = "particle-life"
version = "0.1.0"
description = "Particle Life: emergent artificial life on the GPU with Taichi"
requires-python = ">=3.12,<3.13"
dependencies = ["taichi==1.7.4", "numpy>=2.0"]

[project.scripts]
particle-life = "particle_life.app:main"
particle-life-bench = "particle_life.bench:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/particle_life"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU (run locally only)"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
